name: publish

# 通过 GitHub Release 发布 npm：创建 Release（published）→ 校验 + 测试 → npm publish。
# 打 tag 不会触发发布；release 的 tag 必须与 package.json version 一致。
#
# 发版流程：
#   npm version patch          # bump + commit + tag
#   git push --follow-tags
#   gh release create vX.Y.Z --generate-notes   # 或网页 Create release → 触发本 workflow
#
# 发布走 npm Trusted Publishing（npmjs 包设置里绑定了本仓库 + 本 workflow）：
# OIDC 身份直发，无需 NPM_TOKEN secret。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance / trusted publishing

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Release tag must match package.json version
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag ($GITHUB_REF_NAME) 与 package.json version ($PKG) 不一致"
            exit 1
          fi
          echo "tag = version = $GITHUB_REF_NAME ✓"

      - name: Install
        run: npm ci

      - name: Check & test
        run: |
          npm run check
          npm test

      - name: Skip if version already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already on npm — skipping publish"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure npm supports Trusted Publishing (>= 11.5.1)
        run: npm install -g npm@latest

      - name: Publish to npm
        if: steps.check.outputs.skip != 'true'
        run: npm publish --provenance --access public
